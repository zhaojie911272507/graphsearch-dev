version: "3.9"

services:
  # ──────────────────────────────────────────
  # Neo4j Graph Database
  # ──────────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: graphrag-neo4j
    ports:
      - "7474:7474"   # HTTP (Browser)
      - "7687:7687"   # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/askdataaskdata
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_memory_heap_initial__size: "512m"
      NEO4J_dbms_memory_heap_max__size: "1G"
      NEO4J_dbms_memory_pagecache_size: "512m"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - graphrag

  # ──────────────────────────────────────────
  # Graph RAG Application
  # ──────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: graphrag-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: askdataaskdata
      NEO4J_DATABASE: neo4j
      EMBEDDING_MODEL_PATH: /app/model_files/embeddingmodel/m3e-large
      EMBEDDING_DEVICE: cpu
    volumes:
      - ./model_files:/app/model_files:ro
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - graphrag

  # ──────────────────────────────────────────
  # Monitoring Stack
  # ──────────────────────────────────────────

  # Prometheus
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: graphrag-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    depends_on:
      - app
    networks:
      - graphrag

  # Grafana Tempo
  tempo:
    image: grafana/tempo:2.2.2
    container_name: graphrag-tempo
    ports:
      - "3200:3200"   # Tempo UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - ./monitoring/tempo/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/tmp/tempo
    command:
      - '--config.file=/etc/tempo.yml'
    networks:
      - graphrag

  # Grafana
  grafana:
    image: grafana/grafana:10.0.0
    container_name: graphrag-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
    networks:
      - graphrag

  # Alertmanager
  alertmanager:
    image: prom/alertmanager:v0.25.0
    container_name: graphrag-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - graphrag

volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  prometheus_data:
    driver: local
  tempo_data:
    driver: local
  grafana_data:
    driver: local
  alertmanager_data:
    driver: local

networks:
  graphrag:
    driver: bridge
