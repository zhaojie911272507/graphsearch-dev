version: "3.9"

services:
  # ──────────────────────────────────────────
  # Neo4j Graph Database
  # ──────────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: graphrag-neo4j
    ports:
      - "7474:7474"   # HTTP (Browser)
      - "7687:7687"   # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/askdataaskdata
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_memory_heap_initial__size: "512m"
      NEO4J_dbms_memory_heap_max__size: "1G"
      NEO4J_dbms_memory_pagecache_size: "512m"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - graphrag

  # ──────────────────────────────────────────
  # Graph RAG Application
  # ──────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: graphrag-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: askdataaskdata
      NEO4J_DATABASE: neo4j
      EMBEDDING_MODEL_PATH: /app/model_files/embeddingmodel/m3e-large
      EMBEDDING_DEVICE: cpu
    volumes:
      - ./model_files:/app/model_files:ro
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - graphrag

volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local

networks:
  graphrag:
    driver: bridge
