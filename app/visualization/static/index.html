<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Graph RAG - 知识图谱可视化</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <style>
    :root {
      --bg-primary: #0f1419;
      --bg-secondary: #1a2332;
      --fg-primary: #e6edf3;
      --fg-muted: #8b949e;
      --accent-doc: #58a6ff;
      --accent-chunk: #7ee787;
      --accent-entity: #d2a8ff;
      --accent-concept: #ffa657;
      --border: #30363d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "SF Mono", "Fira Code", "JetBrains Mono", monospace;
      background: var(--bg-primary);
      color: var(--fg-primary);
      min-height: 100vh;
      overflow: hidden;
    }

    .layout {
      display: grid;
      grid-template-rows: 52px 1fr 80px;
      height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .stats {
      display: flex;
      gap: 24px;
      font-size: 0.75rem;
      color: var(--fg-muted);
    }

    .stats span { color: var(--fg-primary); }

    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      padding: 6px 14px;
      font-size: 0.8rem;
      font-family: inherit;
      background: var(--bg-primary);
      color: var(--fg-primary);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .btn:hover {
      background: var(--bg-secondary);
      border-color: var(--accent-doc);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .main {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #graph {
      width: 100%;
      height: 100%;
    }

    .node {
      cursor: pointer;
      fill: var(--fg-muted);
    }

    .node.Document { fill: var(--accent-doc); }
    .node.Chunk { fill: var(--accent-chunk); }
    .node.Entity { fill: var(--accent-entity); }
    .node.Concept { fill: var(--accent-concept); }

    .node:hover { filter: brightness(1.3); }

    .link {
      stroke: var(--border);
      stroke-opacity: 0.6;
      stroke-width: 1px;
    }

    .tooltip {
      position: absolute;
      padding: 10px 14px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.8rem;
      max-width: 320px;
      pointer-events: none;
      z-index: 1000;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    .tooltip .label { color: var(--fg-muted); }
    .tooltip .title { font-weight: 600; margin-bottom: 6px; }
    .tooltip .preview { color: var(--fg-muted); font-size: 0.75rem; line-height: 1.4; }

    .loading, .error {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: var(--fg-muted);
    }

    .error { color: #f85149; }

    footer {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      font-size: 0.75rem;
      color: var(--fg-muted);
    }
  </style>
</head>
<body>
  <div class="layout">
    <header>
      <h1>Graph RAG — 知识图谱可视化</h1>
      <div class="stats" id="stats">
        <span>Document <strong id="docCount">0</strong></span>
        <span>Chunk <strong id="chunkCount">0</strong></span>
        <span>Entity <strong id="entityCount">0</strong></span>
        <span>Concept <strong id="conceptCount">0</strong></span>
      </div>
      <div class="controls">
        <button class="btn" id="reloadBtn">刷新</button>
        <select class="btn" id="limitSelect">
          <option value="100">100 条边</option>
          <option value="300" selected>300 条边</option>
          <option value="500">500 条边</option>
          <option value="1000">1000 条边</option>
        </select>
      </div>
    </header>

    <main class="main">
      <svg id="graph"></svg>
      <div class="tooltip" id="tooltip" style="display: none;"></div>
      <div class="loading" id="loading">加载中…</div>
      <div class="error" id="error" style="display: none;"></div>
    </main>

    <footer>
      <span>POST /api/v1/ingest 导入文档 · POST /api/v1/query 检索问答</span>
    </footer>
  </div>

  <script>
    const API_BASE = '';  // Same origin

    async function fetchGraph(limit = 500) {
      const res = await fetch(`${API_BASE}/viz/graph?limit=${limit}`);
      if (!res.ok) throw new Error('Failed to fetch graph');
      return res.json();
    }

    async function fetchStats() {
      const res = await fetch(`${API_BASE}/viz/stats`);
      if (!res.ok) throw new Error('Failed to fetch stats');
      return res.json();
    }

    function showLoading(show) {
      document.getElementById('loading').style.display = show ? 'block' : 'none';
      document.getElementById('error').style.display = 'none';
    }

    function showError(msg) {
      document.getElementById('loading').style.display = 'none';
      const el = document.getElementById('error');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function updateStats(stats) {
      document.getElementById('docCount').textContent = stats.document_count;
      document.getElementById('chunkCount').textContent = stats.chunk_count;
      document.getElementById('entityCount').textContent = stats.entity_count;
      document.getElementById('conceptCount').textContent = stats.concept_count;
    }

    function renderGraph(data) {
      const svg = d3.select('#graph');
      svg.selectAll('*').remove();

      const { nodes, edges } = data;
      if (!nodes?.length) {
        showError('图谱为空，请先导入文档 (POST /api/v1/ingest)');
        return;
      }

      const width = svg.node().getBoundingClientRect().width;
      const height = svg.node().getBoundingClientRect().height;

      const links = edges.map(e => ({ ...e, source: e.source, target: e.target }));
      const nodeMap = new Map(nodes.map(n => [n.id, { ...n }]));
      links.forEach(l => {
        l.source = nodeMap.get(l.source) ?? nodeMap.set(l.source, { id: l.source, label: '?', title: '', content_preview: '' }).get(l.source);
        l.target = nodeMap.get(l.target) ?? nodeMap.set(l.target, { id: l.target, label: '?', title: '', content_preview: '' }).get(l.target);
      });
      const nodeList = Array.from(nodeMap.values());

      const simulation = d3.forceSimulation(nodeList)
        .force('link', d3.forceLink(links).id(d => d.id).distance(80))
        .force('charge', d3.forceManyBody().strength(-200))
        .force('center', d3.forceCenter(width / 2, height / 2))
        .force('collision', d3.forceCollide().radius(24));

      const g = svg.append('g');

      const link = g.append('g')
        .selectAll('line')
        .data(links)
        .join('line')
        .attr('class', 'link');

      const node = g.append('g')
        .selectAll('circle')
        .data(nodeList)
        .join('circle')
        .attr('class', d => `node ${d.label}`)
        .attr('r', 6)
        .call(d3.drag()
          .on('start', dragstarted)
          .on('drag', dragged)
          .on('end', dragended))
        .on('mouseover', (e, d) => {
          const tt = document.getElementById('tooltip');
          tt.innerHTML = `<div class="label">${d.label}</div><div class="title">${escapeHtml(d.title || d.id)}</div>${d.content_preview ? `<div class="preview">${escapeHtml(d.content_preview)}</div>` : ''}`;
          tt.style.display = 'block';
          tt.style.left = (e.pageX + 12) + 'px';
          tt.style.top = (e.pageY + 12) + 'px';
        })
        .on('mousemove', (e) => {
          document.getElementById('tooltip').style.left = (e.pageX + 12) + 'px';
          document.getElementById('tooltip').style.top = (e.pageY + 12) + 'px';
        })
        .on('mouseout', () => {
          document.getElementById('tooltip').style.display = 'none';
        });

      simulation.on('tick', () => {
        link
          .attr('x1', d => d.source.x)
          .attr('y1', d => d.source.y)
          .attr('x2', d => d.target.x)
          .attr('y2', d => d.target.y);
        node
          .attr('cx', d => d.x)
          .attr('cy', d => d.y);
      });

      const zoom = d3.zoom()
        .scaleExtent([0.2, 4])
        .on('zoom', (e) => g.attr('transform', e.transform));
      svg.call(zoom);

      function dragstarted(e) { if (!e.active) simulation.alphaTarget(0.3).restart(); e.subject.fx = e.subject.x; e.subject.fy = e.subject.y; }
      function dragged(e) { e.subject.fx = e.x; e.subject.fy = e.y; }
      function dragended(e) { if (!e.active) simulation.alphaTarget(0); e.subject.fx = null; e.subject.fy = null; }
    }

    function escapeHtml(s) {
      const div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }

    async function load() {
      showLoading(true);
      try {
        const [graphData, stats] = await Promise.all([
          fetchGraph(Number(document.getElementById('limitSelect').value)),
          fetchStats()
        ]);
        updateStats(stats);
        renderGraph(graphData);
      } catch (err) {
        showError(err.message || '加载失败');
        return;
      }
      showLoading(false);
    }

    document.getElementById('reloadBtn').addEventListener('click', load);
    document.getElementById('limitSelect').addEventListener('change', load);

    load();
  </script>
</body>
</html>
